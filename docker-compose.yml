# =============================================================================
# Docker Compose — Reino Aromas CRM
#
# Perfiles:
#   dev   → levantar desarrollo local:   docker compose --profile dev up
#   prod  → levantar producción:         docker compose --profile prod up -d
#
# Servicios:
#   mysql   — base de datos (ambos perfiles)
#   app     — PHP-FPM con Laravel       (prod)
#   vite    — dev server Vue con HMR    (dev)
#   laravel — artisan serve             (dev)
#   nginx   — proxy reverso             (prod)
#   soketi  — WebSockets self-hosted    (ambos perfiles)
#
# Uso rápido:
#   cp .env.example .env && nano .env   # ajustar variables
#   docker compose --profile dev up     # desarrollo local
#   docker compose --profile prod up -d # producción
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MySQL 8 — base de datos compartida entre dev y prod
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-secret_root}"
      MYSQL_DATABASE:      "${DB_DATABASE:-reino_aromas}"
      MYSQL_USER:          "${DB_USERNAME:-reino_user}"
      MYSQL_PASSWORD:      "${DB_PASSWORD:-reino_pass}"
    volumes:
      # Persistir datos entre reinicios del contenedor
      - mysql_data:/var/lib/mysql
    ports:
      # Expuesto solo en dev para acceso desde herramientas locales (TablePlus, etc.)
      - "${DB_EXPOSE_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-secret_root}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reino_network

  # ---------------------------------------------------------------------------
  # Soketi — servidor WebSockets self-hosted (reemplaza Pusher)
  # Compatible con el protocolo Pusher → Laravel Echo funciona sin cambios.
  # ---------------------------------------------------------------------------
  soketi:
    image: quay.io/soketi/soketi:latest-16-alpine
    restart: unless-stopped
    environment:
      SOKETI_DEBUG:            "${SOKETI_DEBUG:-0}"
      SOKETI_DEFAULT_APP_ID:   "${PUSHER_APP_ID:-reino_app}"
      SOKETI_DEFAULT_APP_KEY:  "${PUSHER_APP_KEY:-reino_key}"
      SOKETI_DEFAULT_APP_SECRET: "${PUSHER_APP_SECRET:-reino_secret}"
    ports:
      - "${SOKETI_PORT:-6001}:6001"       # WebSocket
      - "${SOKETI_METRICS_PORT:-9601}:9601" # métricas (opcional)
    networks:
      - reino_network

  # ===========================================================================
  # PERFIL: dev
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Laravel dev server — php artisan serve
  # ---------------------------------------------------------------------------
  laravel:
    build:
      context: .
      dockerfile: docker/laravel-dev/Dockerfile
    restart: unless-stopped
    profiles: [dev]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV:            local
      APP_DEBUG:          "true"
      APP_URL:            "http://localhost:8000"
      DB_HOST:            mysql
      DB_PORT:            3306
      DB_DATABASE:        "${DB_DATABASE:-reino_aromas}"
      DB_USERNAME:        "${DB_USERNAME:-reino_user}"
      DB_PASSWORD:        "${DB_PASSWORD:-reino_pass}"
      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID:      "${PUSHER_APP_ID:-reino_app}"
      PUSHER_APP_KEY:     "${PUSHER_APP_KEY:-reino_key}"
      PUSHER_APP_SECRET:  "${PUSHER_APP_SECRET:-reino_secret}"
      PUSHER_HOST:        soketi
      PUSHER_PORT:        6001
      PUSHER_SCHEME:      http
      # Vite corre en su propio contenedor; este dominio se incluye en
      # VITE_SANCTUM_STATEFUL_DOMAINS para que las cookies de sesión funcionen.
      SANCTUM_STATEFUL_DOMAINS: "localhost:5173,localhost:8000"
      SESSION_DOMAIN:     localhost
      VITE_APP_URL:       "http://localhost:8000"
    volumes:
      # Montar el código para hot-reload de PHP sin reconstruir la imagen
      - .:/var/www/html
      - /var/www/html/vendor   # excluir vendor del mount (usa el del contenedor)
    ports:
      - "8000:8000"
    networks:
      - reino_network

  # ---------------------------------------------------------------------------
  # Vite dev server — HMR para Vue 3
  # ---------------------------------------------------------------------------
  vite:
    image: node:22-alpine
    restart: unless-stopped
    profiles: [dev]
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_HOST:          "0.0.0.0"
      VITE_PORT:          "5173"
      # La URL de la API de Laravel dentro de la red Docker
      VITE_APP_URL:       "http://localhost:8000"
    volumes:
      # Montar el proyecto completo para que laravel-vite-plugin funcione
      - .:/app
      - /app/node_modules  # excluir node_modules del mount
    ports:
      - "5173:5173"
    networks:
      - reino_network

  # ===========================================================================
  # PERFIL: prod
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # PHP-FPM — imagen de producción (multi-stage build en Dockerfile raíz)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    profiles: [prod]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV:            production
      APP_DEBUG:          "false"
      APP_URL:            "${APP_URL}"
      DB_HOST:            mysql
      DB_PORT:            3306
      DB_DATABASE:        "${DB_DATABASE}"
      DB_USERNAME:        "${DB_USERNAME}"
      DB_PASSWORD:        "${DB_PASSWORD}"
      BROADCAST_CONNECTION: pusher
      PUSHER_APP_ID:      "${PUSHER_APP_ID}"
      PUSHER_APP_KEY:     "${PUSHER_APP_KEY}"
      PUSHER_APP_SECRET:  "${PUSHER_APP_SECRET}"
      PUSHER_HOST:        soketi
      PUSHER_PORT:        6001
      PUSHER_SCHEME:      http
      SANCTUM_STATEFUL_DOMAINS: "${APP_DOMAIN}"
      SESSION_DOMAIN:     "${APP_DOMAIN}"
      QUEUE_CONNECTION:   redis
      REDIS_HOST:         redis
    volumes:
      # Solo storage y .env son mutables en prod; el código está dentro de la imagen
      - app_storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    networks:
      - reino_network

  # ---------------------------------------------------------------------------
  # Nginx — proxy reverso + servir assets estáticos en producción
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    profiles: [prod]
    depends_on:
      - app
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Los assets de public/ los sirve Nginx directamente (sin pasar por PHP)
      - app_storage:/var/www/html/storage:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - reino_network

  # ---------------------------------------------------------------------------
  # Redis — driver de colas y cache en producción
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: [prod]
    volumes:
      - redis_data:/data
    networks:
      - reino_network

  # ---------------------------------------------------------------------------
  # Queue worker — procesa jobs de WhatsApp/Instagram/Facebook en producción
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    profiles: [prod]
    depends_on:
      - app
      - redis
    environment:
      APP_ENV:          production
      DB_HOST:          mysql
      DB_PORT:          3306
      DB_DATABASE:      "${DB_DATABASE}"
      DB_USERNAME:      "${DB_USERNAME}"
      DB_PASSWORD:      "${DB_PASSWORD}"
      QUEUE_CONNECTION: redis
      REDIS_HOST:       redis
    volumes:
      - app_storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    # Supervisor no está disponible aquí — usamos el comando directo.
    # En VPS con más recursos, reemplazar por una imagen con Supervisor.
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    networks:
      - reino_network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  reino_network:
    driver: bridge
