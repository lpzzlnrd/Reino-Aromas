# Nginx — configuración de producción para Reino Aromas CRM
#
# Estructura:
#   - Sirve assets estáticos (public/build, public/assets) directamente
#     sin pasar por PHP → mejor rendimiento
#   - Todo lo demás va a PHP-FPM (contenedor 'app' en puerto 9000)
#   - HTTPS: Let's Encrypt via Certbot (descomentar bloque ssl cuando tengas certs)

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Compresión gzip para assets y JSON
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Assets generados por Vite (public/build/) — cacheados agresivamente
    # porque llevan hash en el nombre de archivo
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Assets estáticos propios (fuentes, logo, favicon)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Favicon
    location = /favicon.ico {
        expires 30d;
        log_not_found off;
        access_log off;
    }

    # Rutas de la app — Laravel maneja todo (incluye SPA catch-all)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        fastcgi_pass   app:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;

        # Timeouts generosos para jobs largos o respuestas de Meta API
        fastcgi_read_timeout 120;
    }

    # Bloquear acceso a archivos sensibles
    location ~ /\.(env|git|htaccess) {
        deny all;
    }
}

