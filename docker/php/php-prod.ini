; =============================================================================
; php-prod.ini — Reino Aromas CRM
; Configuración PHP para producción. Se copia a
; /usr/local/etc/php/conf.d/99-app.ini en el Dockerfile.
; =============================================================================

; --- Errores -----------------------------------------------------------------
; Nunca mostrar errores al usuario en producción: van al log de PHP-FPM,
; que Docker recoge por stderr.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Límites -----------------------------------------------------------------
memory_limit = 256M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M

; --- Zona horaria (Venezuela) ------------------------------------------------
date.timezone = America/Caracas

; --- OPcache -----------------------------------------------------------------
; validate_timestamps=0 hace que OPcache no revise el disco en cada request:
; el código es inmutable dentro de la imagen. Requiere recrear el contenedor
; (o `php artisan opcache:clear`) para que un deploy tome efecto.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

; --- Sesiones ----------------------------------------------------------------
session.cookie_httponly = 1
session.use_strict_mode = 1

; --- Varios ------------------------------------------------------------------
expose_php = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 600
