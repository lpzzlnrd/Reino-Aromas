# =============================================================================
# Docker Compose — Reino Aromas CRM  (DESARROLLO)
#
# Levanta frontend y backend apuntando al MySQL de Laragon que ya corre local.
#
# Uso:
#   docker compose -f docker-compose.dev.yml up
#   docker compose -f docker-compose.dev.yml up --build   (primera vez o tras cambios en Dockerfile)
#   docker compose -f docker-compose.dev.yml down
#
# Servicios:
#   laravel  — php artisan serve en :8080
#   vite     — dev server Vue con HMR en :5274
#
# La BD es el MySQL de Laragon (127.0.0.1:3306 en el host).
# Dentro de los contenedores se accede como host.docker.internal:3306.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend — Laravel (php artisan serve)
  # ---------------------------------------------------------------------------
  laravel:
    build:
      context: .
      dockerfile: docker/laravel-dev/Dockerfile
    restart: unless-stopped
    env_file: .env                        # lee las variables de tu .env existente
    environment:
      APP_ENV:    local
      APP_DEBUG:  "true"
      APP_URL:    "http://localhost:8080"
      # Reemplaza 127.0.0.1 por la dirección especial que Docker usa para el host
      DB_HOST:    host.docker.internal
      DB_PORT:    "3306"
      # Sesión basada en cookies — el dominio debe cubrir ambos puertos
      SANCTUM_STATEFUL_DOMAINS: "localhost:8080,localhost:5274"
      SESSION_DOMAIN: localhost
      # Vite corre en su contenedor; Laravel necesita saber la URL del HMR
      VITE_APP_URL: "http://localhost:8080"
    volumes:
      # Código montado en caliente — cualquier cambio PHP se refleja sin rebuild
      - .:/var/www/html
      # Excluir vendor del mount para usar el del contenedor (más rápido)
      - laravel_vendor:/var/www/html/vendor
      # Excluir node_modules del proyecto raíz también
      - laravel_node_modules:/var/www/html/node_modules
    ports:
      - "8080:8080"
    extra_hosts:
      # Necesario en Linux para resolver host.docker.internal
      - "host.docker.internal:host-gateway"
    networks:
      - reino_dev

  # ---------------------------------------------------------------------------
  # Frontend — Vite dev server (Vue 3 + HMR)
  # ---------------------------------------------------------------------------
  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    # npm ci instala desde package-lock.json (reproducible), luego arranca Vite
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_PORT: "5274"
      VITE_APP_URL: "http://localhost:8080"
    volumes:
      - .:/app
      # node_modules separado para no pisar el del host ni el de laravel
      - vite_node_modules:/app/node_modules
    ports:
      - "5274:5274"
    networks:
      - reino_dev

# =============================================================================
# Volumes nombrados — aíslan vendor y node_modules del host
# =============================================================================
volumes:
  laravel_vendor:
  laravel_node_modules:
  vite_node_modules:

# =============================================================================
# Red interna
# =============================================================================
networks:
  reino_dev:
    driver: bridge
