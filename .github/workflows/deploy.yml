# =============================================================================
# deploy.yml — CD de Reino Aromas CRM
#
# Cada push a main entra por SSH al VPS de Hostinger y actualiza la app
# directamente (sin Docker): git pull, composer, npm build, migraciones.
#
# Secrets requeridos en el repo (Settings > Secrets and variables > Actions):
#   VPS_HOST        IP o dominio del VPS
#   VPS_USER        usuario SSH (ej. root)
#   VPS_SSH_KEY     llave privada completa, incluidos los BEGIN/END
#   VPS_PORT        puerto SSH (opcional, 22 por defecto)
#   VPS_APP_DIR     ruta del repo en el VPS (ej. /var/www/reinoaromas)
# =============================================================================
name: Deploy a producción

on:
  push:
    branches: [main]
  # Permite relanzar un deploy a mano desde la pestaña Actions.
  workflow_dispatch:

# Un deploy a la vez: si llegan dos pushes seguidos, el segundo espera en vez
# de pisar al primero a mitad de las migraciones.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy en el VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Un secret que no existe se interpola como cadena vacía, no falla. Sin
      # esta comprobación el error que sale es "missing server host", que no
      # dice cuál falta.
      - name: Verificar que los secrets estén configurados
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          faltan=""
          for s in VPS_HOST VPS_USER VPS_SSH_KEY VPS_APP_DIR; do
            eval "valor=\$$s"
            [ -z "$valor" ] && faltan="$faltan $s"
          done
          if [ -n "$faltan" ]; then
            echo "::error::Faltan secrets:$faltan — configúralos en Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "Secrets OK."

      - name: Deploy por SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          # Si un deploy vuelve a fallar sin imprimir nada del VPS, agregar
          # `debug: true` aqui: muestra el handshake SSH completo y distingue
          # un fallo de autenticacion de uno de red o de formato de la llave.
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"

            # sudo solo si no somos root, para que funcione con usuario root
            # o con un usuario de deploy con sudoers.
            # if explicito en vez de `cond && accion`: como root la condicion
            # es falsa y la linea devuelve exit 1, lo que bajo script_stop
            # podria abortar el deploy antes de empezar.
            if [ "$(id -u)" -eq 0 ]; then SUDO=""; else SUDO="sudo"; fi

            # Si algo falla a mitad, sacar el sitio de mantenimiento en vez de
            # dejarlo con el 503 puesto indefinidamente.
            #
            # Va en EXIT y no solo en ERR: `trap ERR` no se hereda dentro de
            # funciones ni subshells sin `set -E`, así que un fallo en según qué
            # sitio dejaba el 503 puesto — pasó de verdad el 2026-08-27, con el
            # deploy muerto en el paso de Reverb y el CRM caído para los agentes.
            #
            # EXIT se dispara SIEMPRE, así que el `up` del final del script pasa
            # a ser redundante y no molesta: llamarlo dos veces es inofensivo.
            set -E
            trap 'php artisan up || true' ERR EXIT

            if [ ! -f .env ]; then
              echo "ERROR: no existe .env en $(pwd). Créalo antes del primer deploy." >&2
              exit 1
            fi

            echo "→ Trayendo cambios de main..."
            git fetch origin
            git checkout main
            git reset --hard origin/main
            echo "  commit: $(git rev-parse --short HEAD)"

            echo "→ Activando modo mantenimiento..."
            php artisan down --retry=60 || true

            echo "→ Instalando dependencias PHP..."
            composer install --optimize-autoloader --no-dev --no-interaction --no-progress

            echo "→ Instalando dependencias y compilando frontend..."
            # npm ci respeta package-lock.json: reproducible y más rápido que
            # npm install, que puede resolver versiones distintas a las probadas.
            npm ci --ignore-scripts
            npm run build

            echo "→ Ejecutando migraciones..."
            php artisan migrate --force

            echo "→ Limpiando cachés..."
            php artisan view:clear
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear

            echo "→ Cacheando config para producción..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "→ Reiniciando workers de cola..."
            # Los workers de los Jobs de Meta siguen con el código viejo en
            # memoria hasta que reciben esta señal.
            php artisan queue:restart

            echo "→ Reiniciando Reverb (WebSockets)..."
            # reverb:start es un proceso de larga vida: como el worker de colas,
            # se queda con el código y la config cacheada de antes del deploy.
            # A diferencia de queue:restart, Reverb no tiene señal de reinicio
            # propia, así que hay que reiniciar la unidad.
            #
            # NADA de esto puede tumbar el deploy. El tiempo real es opcional:
            # sin él los mensajes se siguen guardando y la bandeja muestra el
            # botón "Actualizar". Tumbar el sitio por eso es un pésimo negocio,
            # y es justo lo que pasó el 2026-08-27: el paso falló porque la
            # unidad no existía todavía (setup-reverb.sh nunca se había corrido
            # en el VPS) y el CRM quedó con el 503 de mantenimiento puesto.
            #
            # De ahí el `|| true` al final: NO se confía en el `if`. Con
            # `script_stop: true` appleboy corta ante cualquier salida distinta
            # de cero, y `systemctl` devuelve != 0 tanto si la unidad falta como
            # si falla al arrancar. El `|| true` cubre los dos casos de una vez.
            if $SUDO systemctl cat reino-reverb.service >/dev/null 2>&1; then
              $SUDO systemctl restart reino-reverb && echo "  reino-reverb reiniciado." \
                || echo "  AVISO: reino-reverb no arrancó. Revisar: journalctl -u reino-reverb -n 50"
            else
              echo "  reino-reverb no instalado, se omite (ver scripts/setup-reverb.sh)."
            fi || true

            echo "→ Ajustando permisos..."
            $SUDO chown -R www-data:www-data "${{ secrets.VPS_APP_DIR }}"
            $SUDO chmod -R 775 "${{ secrets.VPS_APP_DIR }}/storage" "${{ secrets.VPS_APP_DIR }}/bootstrap/cache"

            echo "→ Recargando PHP-FPM y Nginx..."
            $SUDO systemctl reload php8.4-fpm
            $SUDO systemctl reload nginx

            echo "→ Desactivando modo mantenimiento..."
            php artisan up
            trap - ERR EXIT

            echo "✓ Deploy completado."

      - name: Verificar que el sitio responde
        # Smoke test desde fuera: si el deploy dejó el sitio caído, el job
        # falla y sale la notificación de GitHub.
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 15 \
              "https://reinoaromas.tech/" || echo "000")
            echo "Intento $i: HTTP $code"
            # 200 = home, 302 = redirect al login, 401/403 = app viva tras auth.
            case "$code" in
              200|302|401|403) echo "Sitio arriba."; exit 0 ;;
              503) echo "  (en modo mantenimiento, esperando...)" ;;
            esac
            sleep 10
          done
          echo "El sitio no respondió tras el deploy." >&2
          echo "Revisa los logs en el VPS:" >&2
          echo "  tail -50 storage/logs/laravel.log" >&2
          echo "  journalctl -u php8.4-fpm -n 50" >&2
          exit 1